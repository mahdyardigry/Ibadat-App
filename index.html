<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>عبادت من</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at top,#edf7f2 0,#f5f7f6 45%,#e9efec 100%);
  color:#17201d;
}

.app{
  max-width:650px;
  margin:auto;
  padding:12px;
}

.header{
  background:linear-gradient(145deg,#0e583d,#1d7957);
  color:white;
  border-radius:24px;
  padding:20px 15px;
  text-align:center;
  margin-bottom:14px;
  box-shadow:0 8px 24px rgba(15,85,59,.22);
}

.header h1{
  margin:0 0 7px;
  font-size:27px;
}

.header p{
  margin:0;
  opacity:.9;
}

.card{
  background:rgba(255,255,255,.96);
  border-radius:22px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}

select,
input,
button{
  width:100%;
  min-height:50px;
  border-radius:15px;
  border:1px solid #d3ddd8;
  font-size:17px;
  padding:10px;
  background:white;
}

button{
  cursor:pointer;
  font-weight:bold;
  touch-action:manipulation;
}

.mainBtn{
  background:#176b4d;
  color:white;
  border:0;
}

.secondary{
  background:#edf3f0;
}

.danger{
  background:#fff0f0;
  color:#a11;
}

.tasbihBox{
  text-align:center;
  padding-top:4px;
}

.dhikr{
  font-size:25px;
  font-weight:bold;
  color:#176b4d;
  margin:4px 0;
}

.goal{
  color:#66746e;
  margin-bottom:8px;
  font-size:15px;
}

.tasbih{
  position:relative;
  width:min(94vw,440px);
  height:min(94vw,440px);
  margin:4px auto 0;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.rope{
  position:absolute;
  inset:25px;
  border:5px solid #9a6b38;
  border-radius:50%;
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.35),
    0 3px 8px rgba(80,50,20,.18);
}

.ropeTop{
  position:absolute;
  width:55px;
  height:55px;
  left:50%;
  top:-3px;
  transform:translateX(-50%);
  border:5px solid #9a6b38;
  border-radius:50%;
  background:#f7eee0;
  z-index:1;
}

.bead{
  position:absolute;
  width:36px;
  height:36px;
  margin:-18px;
  border-radius:50%;
  background:
    radial-gradient(
      circle at 30% 25%,
      #fff9e9 0,
      #d7a85c 20%,
      #9b682e 70%,
      #70461e 100%
    );
  border:2px solid #6f471e;
  box-shadow:
    inset -4px -5px 8px rgba(70,40,10,.28),
    inset 3px 3px 6px rgba(255,255,255,.35),
    0 4px 7px rgba(60,40,15,.28);
  transition:
    transform .18s ease,
    filter .18s ease,
    width .18s ease,
    height .18s ease;
  z-index:2;
}

.bead.active{
  width:45px;
  height:45px;
  margin:-22.5px;
  filter:brightness(1.18);
  box-shadow:
    0 0 0 5px rgba(23,107,77,.16),
    inset -4px -5px 8px rgba(70,40,10,.25),
    0 5px 12px rgba(23,107,77,.35);
  z-index:5;
}

.markerBead{
  background:
    radial-gradient(
      circle at 30% 25%,
      #fff,
      #d8b06c 20%,
      #8d5a25 65%,
      #563414
    );
}

.bead::after{
  content:"";
  position:absolute;
  width:8px;
  height:8px;
  background:#805522;
  border-radius:50%;
  left:50%;
  top:-5px;
  transform:translateX(-50%);
  z-index:-1;
}

.counterCenter{
  position:absolute;
  width:142px;
  height:142px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:
    radial-gradient(circle,#fffdf8,#f2eee5);
  border:4px solid #176b4d;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:8;
  box-shadow:
    0 7px 18px rgba(0,0,0,.14),
    inset 0 2px 5px rgba(255,255,255,.8);
  pointer-events:none;
}

.count{
  font-size:54px;
  font-weight:bold;
  line-height:1;
  color:#176b4d;
}

.countLabel{
  font-size:12px;
  color:#68756f;
  margin-top:6px;
}

.instruction{
  text-align:center;
  color:#66736e;
  font-size:14px;
  margin-top:-2px;
}

.progress{
  height:10px;
  background:#e5ebe8;
  border-radius:20px;
  overflow:hidden;
  margin:12px 0;
}

.progress div{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#176b4d,#35a579);
  transition:.2s;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:#f2f6f4;
  border-radius:15px;
  padding:14px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:25px;
  color:#176b4d;
  margin-top:5px;
}

.small{
  font-size:13px;
  color:#66736e;
}

.status{
  text-align:center;
  color:#176b4d;
  font-weight:bold;
  min-height:22px;
  margin-top:5px;
}

.footer{
  text-align:center;
  color:#718079;
  padding:20px 0;
  font-size:13px;
}

/* سالمندان */

body.senior{
  font-size:20px;
}

body.senior .header h1{
  font-size:32px;
}

body.senior .title{
  font-size:25px;
}

body.senior button,
body.senior select,
body.senior input{
  min-height:65px;
  font-size:22px;
}

body.senior .tasbih{
  width:min(96vw,470px);
  height:min(96vw,470px);
}

body.senior .bead{
  width:43px;
  height:43px;
  margin:-21.5px;
}

body.senior .bead.active{
  width:52px;
  height:52px;
  margin:-26px;
}

body.senior .counterCenter{
  width:165px;
  height:165px;
}

body.senior .count{
  font-size:68px;
}

body.senior .dhikr{
  font-size:30px;
}

/* شب */

body.dark{
  background:#111815;
  color:#edf4f0;
}

body.dark .card{
  background:#1b2420;
}

body.dark select,
body.dark input{
  background:#202b26;
  color:#fff;
  border-color:#37453f;
}

body.dark .secondary{
  background:#29352f;
  color:white;
}

body.dark .danger{
  background:#351d1d;
  color:#ffb6b6;
}

body.dark .stat{
  background:#24302b;
}

body.dark .counterCenter{
  background:#202722;
}

body.dark .count{
  color:#62c79e;
}

body.dark .dhikr{
  color:#62c79e;
}

body.dark .goal,
body.dark .instruction,
body.dark .countLabel,
body.dark .small,
body.dark .footer{
  color:#aab8b2;
}

@media(max-width:380px){

  .app{
    padding:8px;
  }

  .card{
    padding:12px;
    border-radius:18px;
  }

  .header{
    border-radius:20px;
    padding:17px 12px;
  }

  .header h1{
    font-size:24px;
  }

  .tasbih{
    width:94vw;
    height:94vw;
  }

  .counterCenter{
    width:125px;
    height:125px;
  }

  .count{
    font-size:46px;
  }

  .bead{
    width:32px;
    height:32px;
    margin:-16px;
  }

  .bead.active{
    width:41px;
    height:41px;
    margin:-20.5px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>🕌 عبادت من</h1>
    <p>ذکر • نماز • قرآن • دعا • آرامش</p>
  </div>

  <!-- انتخاب ذکر -->

  <div class="card">

    <div class="title">📿 انتخاب ذکر</div>

    <select id="dhikrSelect">

      <option value="subhan">
        سبحان‌الله — ۳۳
      </option>

      <option value="hamd">
        الحمدلله — ۳۳
      </option>

      <option value="allah">
        الله‌اکبر — ۳۴
      </option>

      <option value="salavat">
        صلوات — ۱۰۰
      </option>

      <option value="custom">
        ذکر دلخواه
      </option>

      <option value="unlimited">
        شمارش نامحدود
      </option>

    </select>

    <div
      id="customBox"
      style="display:none;margin-top:10px"
    >

      <input
        id="customName"
        placeholder="نام ذکر">

      <input
        id="customLimit"
        type="number"
        min="0"
        placeholder="تعداد هدف، خالی = نامحدود"
        style="margin-top:8px">

    </div>

  </div>

  <!-- تسبیح -->

  <div class="card">

    <div class="tasbihBox">

      <div
        class="dhikr"
        id="currentDhikr">
        سبحان‌الله
      </div>

      <div
        class="goal"
        id="limitText">
        هدف: ۳۳
      </div>

      <div
        class="tasbih"
        id="tasbih">

        <div class="rope"></div>

        <div class="ropeTop"></div>

        <div id="beads"></div>

        <div class="counterCenter">

          <div
            class="count"
            id="count">
            ۰
          </div>

          <div class="countLabel">
            تعداد ذکر
          </div>

        </div>

      </div>

      <div class="instruction">
        👆 روی دانه بزنید یا انگشت را روی تسبیح بکشید
      </div>

      <div
        class="status"
        id="status">
      </div>

      <div class="progress">
        <div id="progressBar"></div>
      </div>

      <div class="row">

        <button
          class="secondary"
          id="minusBtn">
          − یک عدد
        </button>

        <button
          class="danger"
          id="resetBtn">
          🔄 صفر کردن
        </button>

      </div>

    </div>

  </div>

  <!-- آمار -->

  <div class="card">

    <div class="title">
      📊 آمار من
    </div>

    <div class="stats">

      <div class="stat">
        صلوات
        <b id="totalSalavat">۰</b>
      </div>

      <div class="stat">
        سبحان‌الله
        <b id="totalSubhan">۰</b>
      </div>

      <div class="stat">
        الحمدلله
        <b id="totalHamd">۰</b>
      </div>

      <div class="stat">
        الله‌اکبر
        <b id="totalAllah">۰</b>
      </div>

    </div>

  </div>

  <!-- سالمندان -->

  <div class="card">

    <div class="title">
      🧓 حالت سالمندان
    </div>

    <button
      class="mainBtn"
      id="seniorBtn">
      🧓 فعال کردن حالت سالمندان
    </button>

  </div>

  <!-- تنظیمات -->

  <div class="card">

    <div class="title">
      ⚙️ تنظیمات
    </div>

    <div class="row">

      <button
        class="secondary"
        id="soundBtn">
        🔊 صدای شمارش: روشن
      </button>

      <button
        class="secondary"
        id="vibrateBtn">
        📳 لرزش: روشن
      </button>

    </div>

    <button
      class="secondary"
      id="darkBtn"
      style="margin-top:10px">
      ☀️ حالت روز
    </button>

    <button
      class="danger"
      id="clearAllBtn"
      style="margin-top:10px">
      🗑 پاک کردن همه آمار
    </button>

  </div>

  <div class="footer">
    عبادت من — نسخه آزمایشی<br>
    اطلاعات شمارش روی همین گوشی ذخیره می‌شود.
  </div>

</div>

<script>

/* =========================
   DATA
========================= */

const dhikrData = {

  subhan:{
    name:"سبحان‌الله",
    limit:33,
    stat:"totalSubhan"
  },

  hamd:{
    name:"الحمدلله",
    limit:33,
    stat:"totalHamd"
  },

  allah:{
    name:"الله‌اکبر",
    limit:34,
    stat:"totalAllah"
  },

  salavat:{
    name:"صلوات",
    limit:100,
    stat:"totalSalavat"
  },

  unlimited:{
    name:"شمارش نامحدود",
    limit:0,
    stat:null
  }

};


/* =========================
   STATE
========================= */

let selected = "subhan";

let count = 0;

let sound =
  localStorage.getItem("ibadat_sound") !== "0";

let vibration =
  localStorage.getItem("ibadat_vibration") !== "0";

let totals;

try{

  totals = JSON.parse(
    localStorage.getItem("ibadat_totals") ||
    '{"totalSalavat":0,"totalSubhan":0,"totalHamd":0,"totalAllah":0}'
  );

}catch(e){

  totals = {
    totalSalavat:0,
    totalSubhan:0,
    totalHamd:0,
    totalAllah:0
  };

}


/* =========================
   ELEMENTS
========================= */

const select =
  document.getElementById("dhikrSelect");

const customBox =
  document.getElementById("customBox");

const customName =
  document.getElementById("customName");

const customLimit =
  document.getElementById("customLimit");

const tasbih =
  document.getElementById("tasbih");

const beads =
  document.getElementById("beads");

const countEl =
  document.getElementById("count");

const currentDhikr =
  document.getElementById("currentDhikr");

const limitText =
  document.getElementById("limitText");

const progressBar =
  document.getElementById("progressBar");

const statusEl =
  document.getElementById("status");

const soundBtn =
  document.getElementById("soundBtn");

const vibrateBtn =
  document.getElementById("vibrateBtn");

const seniorBtn =
  document.getElementById("seniorBtn");

const darkBtn =
  document.getElementById("darkBtn");


/* =========================
   STORAGE
========================= */

function saveTotals(){

  localStorage.setItem(
    "ibadat_totals",
    JSON.stringify(totals)
  );

}

function saveCount(){

  localStorage.setItem(
    "ibadat_count_" + selected,
    String(count)
  );

}


/* =========================
   CONFIG
========================= */

function getConfig(){

  if(selected === "custom"){

    let name =
      customName.value.trim();

    if(!name){
      name = "ذکر دلخواه";
    }

    let limit =
      parseInt(customLimit.value,10);

    if(
      Number.isNaN(limit) ||
      limit < 0
    ){
      limit = 0;
    }

    return {
      name:name,
      limit:limit,
      stat:null
    };

  }

  return dhikrData[selected];

}


/* =========================
   BEADS
========================= */

const BEAD_COUNT = 33;

function createBeads(){

  beads.innerHTML = "";

  const center = 50;
  const radius = 43;

  for(let i=0;i<BEAD_COUNT;i++){

    const bead =
      document.createElement("div");

    bead.className = "bead";

    if(
      i === 8 ||
      i === 19 ||
      i === 30
    ){
      bead.classList.add("markerBead");
    }

    const angle =
      (-90 + (360 / BEAD_COUNT) * i)
      * Math.PI / 180;

    const x =
      center +
      radius * Math.cos(angle);

    const y =
      center +
      radius * Math.sin(angle);

    bead.style.left = x + "%";
    bead.style.top = y + "%";

    bead.dataset.index = i;

    beads.appendChild(bead);

  }

  updateActiveBead();

}


function updateActiveBead(){

  const list =
    beads.querySelectorAll(".bead");

  list.forEach(
    bead =>
      bead.classList.remove("active")
  );

  if(!list.length){
    return;
  }

  const index =
    count % BEAD_COUNT;

  list[index].classList.add("active");

}


/* =========================
   LOAD
========================= */

function loadCount(){

  count =
    parseInt(
      localStorage.getItem(
        "ibadat_count_" + selected
      ) || "0",
      10
    );

  if(
    Number.isNaN(count) ||
    count < 0
  ){
    count = 0;
  }

  updateUI();

}


/* =========================
   PERSIAN NUMBERS
========================= */

function toFa(n){

  return String(n).replace(
    /\d/g,
    d => "۰۱۲۳۴۵۶۷۸۹"[d]
  );

}


/* =========================
   UI
========================= */

function updateUI(){

  const config =
    getConfig();

  countEl.textContent =
    toFa(count);

  currentDhikr.textContent =
    config.name;

  if(config.limit > 0){

    limitText.textContent =
      "هدف: " +
      toFa(config.limit);

    const percent =
      Math.min(
        100,
        (count / config.limit) * 100
      );

    progressBar.style.width =
      percent + "%";

  }else{

    limitText.textContent =
      "هدف: نامحدود";

    progressBar.style.width =
      "0%";

  }

  document.getElementById(
    "totalSalavat"
  ).textContent =
    toFa(totals.totalSalavat || 0);

  document.getElementById(
    "totalSubhan"
  ).textContent =
    toFa(totals.totalSubhan || 0);

  document.getElementById(
    "totalHamd"
  ).textContent =
    toFa(totals.totalHamd || 0);

  document.getElementById(
    "totalAllah"
  ).textContent =
    toFa(totals.totalAllah || 0);

  updateActiveBead();

}


/* =========================
   SOUND
========================= */

let audioCtx = null;

function beep(){

  if(!sound){
    return;
  }

  try{

    const AC =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AC){
      return;
    }

    if(!audioCtx){
      audioCtx = new AC();
    }

    if(
      audioCtx.state === "suspended"
    ){
      audioCtx.resume();
    }

    const osc =
      audioCtx.createOscillator();

    const gain =
      audioCtx.createGain();

    const now =
      audioCtx.currentTime;

    osc.type = "sine";

    osc.frequency.setValueAtTime(
      620,
      now
    );

    osc.frequency.exponentialRampToValueAtTime(
      820,
      now + .06
    );

    gain.gain.setValueAtTime(
      .0001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      .055,
      now + .01
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      now + .09
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);

    osc.stop(now + .1);

  }catch(e){}

}


/* =========================
   VIBRATION
========================= */

function vibrate(){

  if(
    vibration &&
    "vibrate" in navigator
  ){

    try{
      navigator.vibrate(25);
    }catch(e){}

  }

}


/* =========================
   COMPLETE
========================= */

function completeMessage(){

  const config =
    getConfig();

  statusEl.textContent =
    "✅ " +
    config.name +
    " کامل شد";

  if(
    vibration &&
    "vibrate" in navigator
  ){

    try{

      navigator.vibrate([
        100,
        70,
        100,
        70,
        180
      ]);

    }catch(e){}

  }

  if(sound){

    setTimeout(
      beep,
      100
    );

    setTimeout(
      beep,
      250
    );

  }

}


/* =========================
   INCREMENT
========================= */

function increment(){

  const config =
    getConfig();

  if(
    config.limit > 0 &&
    count >= config.limit
  ){

    completeMessage();

    return;
  }

  count++;

  saveCount();

  if(config.stat){

    totals[config.stat] =
      (totals[config.stat] || 0) + 1;

    saveTotals();

  }

  beep();

  vibrate();

  statusEl.textContent =
    "ذکر شماره " +
    toFa(count);

  updateUI();

  if(
    config.limit > 0 &&
    count === config.limit
  ){

    completeMessage();

  }

}


/* =========================
   DECREMENT
========================= */

function decrement(){

  if(count <= 0){

    statusEl.textContent =
      "شمارنده صفر است";

    return;

  }

  const config =
    getConfig();

  count--;

  if(config.stat){

    totals[config.stat] =
      Math.max(
        0,
        (totals[config.stat] || 0) - 1
      );

    saveTotals();

  }

  saveCount();

  statusEl.textContent =
    "یک عدد کم شد";

  updateUI();

}


/* =========================
   RESET
========================= */

function resetCurrent(){

  if(count <= 0){

    statusEl.textContent =
      "شمارنده همین حالا صفر است";

    return;

  }

  const config =
    getConfig();

  const ok =
    confirm(
      "شمارنده «" +
      config.name +
      "» صفر شود؟"
    );

  if(!ok){
    return;
  }

  if(config.stat){

    totals[config.stat] =
      Math.max(
        0,
        (totals[config.stat] || 0) - count
      );

    saveTotals();

  }

  count = 0;

  saveCount();

  statusEl.textContent =
    "شمارنده صفر شد";

  updateUI();

}


/* =========================
   TOUCH
========================= */

let startX = 0;
let startY = 0;
let pointerActive = false;

tasbih.addEventListener(
  "pointerdown",
  function(e){

    startX = e.clientX;
    startY = e.clientY;
    pointerActive = true;

    try{
      tasbih.setPointerCapture(
        e.pointerId
      );
    }catch(err){}

  }
);

tasbih.addEventListener(
  "pointerup",
  function(e){

    if(!pointerActive){
      return;
    }

    pointerActive = false;

    const dx =
      e.clientX - startX;

    const dy =
      e.clientY - startY;

    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

    if(distance >= 8){

      increment();

    }else{

      increment();

    }

  }
);

tasbih.addEventListener(
  "pointercancel",
  function(){

    pointerActive = false;

  }
);

/* =========================
   SENIOR MODE
========================= */

function setSenior(active){

  document.body.classList.toggle(
    "senior",
    active
  );

  seniorBtn.textContent =
    active
    ? "🧓 حالت سالمندان فعال است"
    : "🧓 فعال کردن حالت سالمندان";

  localStorage.setItem(
    "ibadat_senior",
    active ? "1" : "0"
  );

}

seniorBtn.addEventListener(
  "click",
  function(){

    setSenior(
      !document.body.classList.contains(
        "senior"
      )
    );

  }
);


/* =========================
   DARK MODE
========================= */

function updateDarkButton(){

  darkBtn.textContent =
    document.body.classList.contains("dark")
    ? "🌙 حالت شب: روشن"
    : "☀️ حالت روز";

}

darkBtn.addEventListener(
  "click",
  function(){

    const active =
      document.body.classList.toggle(
        "dark"
      );

    localStorage.setItem(
      "ibadat_dark",
      active ? "1" : "0"
    );

    updateDarkButton();

  }
);


/* =========================
   CLEAR ALL
========================= */

document
  .getElementById("clearAllBtn")
  .addEventListener(
    "click",
    function(){

      const ok =
        confirm(
          "تمام شمارنده‌ها و آمار پاک شوند؟"
        );

      if(!ok){
        return;
      }

      localStorage.clear();

      totals = {
        totalSalavat:0,
        totalSubhan:0,
        totalHamd:0,
        totalAllah:0
      };

      count = 0;

      sound = true;

      vibration = true;

      localStorage.setItem(
        "ibadat_sound",
        "1"
      );

      localStorage.setItem(
        "ibadat_vibration",
        "1"
      );

      soundBtn.textContent =
        "🔊 صدای شمارش: روشن";

      vibrateBtn.textContent =
        "📳 لرزش: روشن";

      saveTotals();

      saveCount();

      statusEl.textContent =
        "همه آمار پاک شد";

      updateUI();

    }
  );
